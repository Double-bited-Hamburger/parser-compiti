name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  # Come lo avvia chi scarica il programma: avvia.bat / avvia.sh preparano .venv da soli e partono.
  avvio:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          call avvia.bat --version || exit /b 1
          call avvia.bat --version || exit /b 1
      - if: runner.os != 'Windows'
        run: ./avvia.sh --version && sh avvia.sh --version
